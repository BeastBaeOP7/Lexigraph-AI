version: "3.8"

services:
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - CHROMA_DB_PATH=data/chroma_db
      - BM25_INDEX_PATH=data/bm25_index.pkl
    volumes:
      - data-volume:/workspace/data

  frontend:
    build: .
    command: streamlit run streamlit_app/app.py --server.port 8501 --server.address 0.0.0.0
    ports:
      - "8501:8501"
    depends_on:
      - api
    environment:
      - BACKEND_API_URL=http://api:8000

volumes:
  data-volume:
